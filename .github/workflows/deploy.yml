name: CI/CD Deploy to VPS

on:
  push:
    branches: [master, main]

jobs:
  deploy:
    name: Deploy to VPS
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup SSH and Deploy
        env:
          SSH_PRIVATE_KEY: ${{ secrets.VPS_SSH_KEY }}
          VPS_HOST: ${{ secrets.VPS_HOST }}
          VPS_USER: ${{ secrets.VPS_USER }}
        run: |
          if [ -z "$SSH_PRIVATE_KEY" ] || [ -z "$VPS_HOST" ] || [ -z "$VPS_USER" ]; then
            echo "Error: Uno o más secrets obligatorios (VPS_SSH_KEY, VPS_HOST, VPS_USER) están vacíos."
            exit 1
          fi

          mkdir -p ~/.ssh
          echo "$SSH_PRIVATE_KEY" > ~/.ssh/deploy_key
          chmod 600 ~/.ssh/deploy_key

          # Crear directorio en VPS si no existe
          ssh -i ~/.ssh/deploy_key -o StrictHostKeyChecking=no "$VPS_USER@$VPS_HOST" "mkdir -p ~/tss-bot/storage ~/tss-bot/filebrowser_data"

          # Sincronizar archivos del proyecto hacia la VPS
          rsync -avz \
            --exclude '.git' \
            --exclude '.env' \
            --exclude 'storage' \
            --exclude 'filebrowser_data' \
            --exclude '__pycache__' \
            -e "ssh -i ~/.ssh/deploy_key -o StrictHostKeyChecking=no" \
            ./ "$VPS_USER@$VPS_HOST:~/tss-bot/"

          # Desplegar con Docker Compose en la VPS
          ssh -i ~/.ssh/deploy_key -o StrictHostKeyChecking=no "$VPS_USER@$VPS_HOST" "cd ~/tss-bot && docker compose up -d --build"
