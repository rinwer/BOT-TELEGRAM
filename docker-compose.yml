services:
  tss-bot:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: tss-bot
    restart: unless-stopped
    env_file:
      - path: .env
        required: false
    environment:
      - TELEGRAM_TOKEN=${TELEGRAM_TOKEN}
      - STORAGE_PATH=/app/storage
      - SESSION_DIR=/app/storage
      - PROXY_URL=${PROXY_URL:-}
    volumes:
      - ./storage:/app/storage
    logging:
      driver: "json-file"
      options:
        max-size: "20m"
        max-file: "3"

  filebrowser:
    image: filebrowser/filebrowser:latest
    container_name: tss-filebrowser
    user: "0:0"
    restart: unless-stopped
    ports:
      - "${FILEBROWSER_PORT:-8080}:80"
    volumes:
      - ./storage:/srv
      - ./filebrowser_data:/database
    environment:
      - FB_DATABASE=/database/filebrowser.db
      - FB_ROOT=/srv
    logging:
      driver: "json-file"
      options:
        max-size: "20m"
        max-file: "3"
